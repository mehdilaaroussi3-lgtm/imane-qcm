<html lang="fr">

  <meta name="theme-color" content="#0ea5e9" />
  <title>MICI QCM — Prépa Gastro</title>
  <meta name="description" content="QCM de gastro-entérologie sur les MICI : entraînement par chapitre, thème, mix aléatoire ou examen blanc." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="styles.css" />

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- Top bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="#/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center text-white font-extrabold shadow-sm shadow-sky-200">M</div>
        <div class="leading-tight">
          <div class="font-bold text-slate-900 text-[15px]">MICI QCM</div>
          <div class="text-[10px] text-slate-500 uppercase tracking-wider">Prépa Gastro</div>
        </div>
      </a>
      <nav class="hidden md:flex items-center gap-1 text-sm">
        <a href="#/" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 text-slate-700 font-medium">Accueil</a>
        <a href="#/mixed" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 text-slate-700 font-medium">Mixte</a>
        <a href="#/exam" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 text-slate-700 font-medium">Examen</a>
        <a href="#/stats" class="px-3 py-1.5 rounded-lg hover:bg-slate-100 text-slate-700 font-medium">Stats</a>

    </div>
  </header>

  <main id="app" class="max-w-5xl mx-auto px-4 sm:px-6 py-5 sm:py-8 pb-24 md:pb-12 min-h-[60vh]">
    <!-- Initial loader while JS boots -->
    <div class="text-center py-16">
      <div class="inline-block w-6 h-6 border-3 border-slate-200 border-t-sky-500 rounded-full animate-spin"></div>
      <p class="text-xs text-slate-400 mt-3">Chargement…</p>
    </div>
  </main>

  <!-- Bottom mobile nav -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-slate-200 grid grid-cols-4 text-[11px] font-medium">
    <a href="#/"      class="flex flex-col items-center justify-center py-2.5 text-slate-600 active:bg-slate-100">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Accueil

    <a href="#/mixed" class="flex flex-col items-center justify-center py-2.5 text-slate-600 active:bg-slate-100">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16M4 12h16M4 19h7"/></svg>
      Mixte

    <a href="#/exam"  class="flex flex-col items-center justify-center py-2.5 text-slate-600 active:bg-slate-100">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Examen
    </a>
    <a href="#/stats" class="flex flex-col items-center justify-center py-2.5 text-slate-600 active:bg-slate-100">
      <svg class="w-5 h-5 mb-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 17v-6m6 6V7m6 10v-4m6 4V11"/></svg>
      Stats
    </a>
  </nav>

  <footer class="hidden md:block border-t border-slate-200 py-5 text-center text-xs text-slate-400">
    MICI QCM · Préparation gastro-entérologie · Bonne chance Imane 💪
  </footer>

          <circle cx="14" cy="34" r="10"/><circle cx="106" cy="34" r="10"/>
        </g>
        <ellipse cx="60" cy="68" rx="28" ry="32" fill="#f1c79a"/>
        <g fill="#3b2412">
          <circle cx="42" cy="44" r="8"/><circle cx="55" cy="40" r="8"/>
          <circle cx="68" cy="40" r="8"/><circle cx="78" cy="44" r="8"/>
          <circle cx="36" cy="52" r="6"/><circle cx="84" cy="52" r="6"/>
        </g>
        <circle cx="42" cy="80" r="7" fill="url(#bcheek)"/>
        <circle cx="78" cy="80" r="7" fill="url(#bcheek)"/>
        <g fill="#a16143">
          <circle cx="48" cy="74" r="0.9"/><circle cx="52" cy="76" r="0.9"/>
          <circle cx="56" cy="74" r="0.9"/><circle cx="60" cy="73" r="0.9"/>
          <circle cx="64" cy="74" r="0.9"/><circle cx="68" cy="76" r="0.9"/>

        <ellipse cx="49" cy="68" rx="3.2" ry="3.8" fill="#fff"/>
        <ellipse cx="71" cy="68" rx="3.2" ry="3.8" fill="#fff"/>
        <circle cx="49.4" cy="68.8" r="2.4" fill="#4a2c14"/>
        <circle cx="71.4" cy="68.8" r="2.4" fill="#4a2c14"/>
        <circle cx="50.2" cy="67.6" r="0.8" fill="#fff"/>
        <circle cx="72.2" cy="67.6" r="0.8" fill="#fff"/>
        <path d="M44 61 Q49 58 54 61" stroke="#3b2412" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M66 61 Q71 58 76 61" stroke="#3b2412" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path class="buddy-mouth" d="M50 86 Q60 100 70 86 Q60 94 50 86 Z" fill="#c0533a" stroke="#7a3a2a" stroke-width="1.4"/>

          <path d="M100 38 l2 2 -2 2 -2 -2 z" fill="#fde047"/>
