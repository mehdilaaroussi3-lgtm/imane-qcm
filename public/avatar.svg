<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9a8a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f9a8a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Big curly hair (back layer, lots of loose curls) -->
  <g fill="#3b2412">
    <ellipse cx="60" cy="48" rx="42" ry="36"/>
    <circle cx="22" cy="48" r="12"/>
    <circle cx="98" cy="48" r="12"/>
    <circle cx="18" cy="64" r="11"/>
    <circle cx="102" cy="64" r="11"/>
    <circle cx="25" cy="82" r="10"/>
    <circle cx="95" cy="82" r="10"/>
    <circle cx="30" cy="20" r="11"/>
    <circle cx="48" cy="14" r="11"/>
    <circle cx="72" cy="14" r="11"/>
    <circle cx="90" cy="20" r="11"/>
    <circle cx="14" cy="34" r="10"/>
    <circle cx="106" cy="34" r="10"/>
  </g>

  <!-- Face -->
  <ellipse cx="60" cy="68" rx="28" ry="32" fill="#f1c79a"/>

  <!-- Curl bangs on forehead -->
  <g fill="#3b2412">
    <circle cx="42" cy="44" r="8"/>
    <circle cx="55" cy="40" r="8"/>
    <circle cx="68" cy="40" r="8"/>
    <circle cx="78" cy="44" r="8"/>
    <circle cx="36" cy="52" r="6"/>
    <circle cx="84" cy="52" r="6"/>
  </g>

  <!-- Cheeks blush -->
  <circle cx="42" cy="78" r="7" fill="url(#cheek)"/>
  <circle cx="78" cy="78" r="7" fill="url(#cheek)"/>

  <!-- Freckles across the nose & cheeks -->
  <g fill="#a16143">
    <circle cx="48" cy="74" r="0.9"/>
    <circle cx="52" cy="76" r="0.9"/>
    <circle cx="56" cy="74" r="0.9"/>
    <circle cx="60" cy="73" r="0.9"/>
    <circle cx="64" cy="74" r="0.9"/>
    <circle cx="68" cy="76" r="0.9"/>
    <circle cx="72" cy="74" r="0.9"/>
    <circle cx="44" cy="78" r="0.8"/>
    <circle cx="50" cy="80" r="0.8"/>
    <circle cx="70" cy="80" r="0.8"/>
    <circle cx="76" cy="78" r="0.8"/>
    <circle cx="54" cy="72" r="0.7"/>
    <circle cx="66" cy="72" r="0.7"/>
  </g>

  <!-- Eyes -->
  <g>
    <ellipse cx="49" cy="68" rx="3.2" ry="3.8" fill="#fff"/>
    <ellipse cx="71" cy="68" rx="3.2" ry="3.8" fill="#fff"/>
    <circle cx="49.4" cy="68.8" r="2.4" fill="#4a2c14"/>
    <circle cx="71.4" cy="68.8" r="2.4" fill="#4a2c14"/>
    <circle cx="50.2" cy="67.6" r="0.8" fill="#fff"/>
    <circle cx="72.2" cy="67.6" r="0.8" fill="#fff"/>
  </g>
  <!-- Brows -->
  <path d="M44 61 Q49 58 54 61" stroke="#3b2412" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M66 61 Q71 58 76 61" stroke="#3b2412" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M52 88 Q60 95 68 88" stroke="#7a3a2a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Small body / neck -->
  <rect x="50" y="98" width="20" height="10" rx="3" fill="#f1c79a"/>
  <path d="M30 138 Q60 110 90 138 Z" fill="#8b5cf6"/>
</svg>
